# HealthLab Portal CI/CD
#
# Quality gate + deploy in one pipeline. No AWS credentials required for the
# CI jobs (backend: SAM validation + pytest; frontend: lint + test + build).
# Deploy only runs on a push to main (never on a PR), only after both CI
# jobs pass, and only when backend/frontend/workflow files actually
# changed - a docs-only commit runs nothing at all. Deploy authenticates to
# AWS via GitHub's OIDC provider, assuming a role scoped to this repo's
# main branch - no stored AWS credentials.

name: CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  DEPLOY_ROLE_ARN: arn:aws:iam::460223322833:role/healthlab-github-deploy
  STACK_NAME: healthlab-portal-dev
  SAM_ENVIRONMENT: dev

jobs:
  backend:
    name: Backend — validate & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'

      - name: Install AWS SAM CLI
        uses: aws-actions/setup-sam@f84ec7d548307efafe33230528756de3c5841a17 # v2
        with:
          use-installer: true

      - name: Validate SAM template
        run: sam validate --lint

      - name: Install test dependencies
        run: pip install -r tests/requirements.txt

      - name: Run tests
        run: pytest -q

  frontend:
    name: Frontend — lint, test & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  deploy-backend:
    name: Deploy backend (SAM)
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: backend
    outputs:
      patient_api_url: ${{ steps.outputs.outputs.patient_api_url }}
      cognito_domain: ${{ steps.outputs.outputs.cognito_domain }}
      cognito_client_id: ${{ steps.outputs.outputs.cognito_client_id }}
      frontend_bucket: ${{ steps.outputs.outputs.frontend_bucket }}
      frontend_distribution_id: ${{ steps.outputs.outputs.frontend_distribution_id }}
      frontend_url: ${{ steps.outputs.outputs.frontend_url }}
      custom_domain_url: ${{ steps.outputs.outputs.custom_domain_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'

      - name: Install AWS SAM CLI
        uses: aws-actions/setup-sam@f84ec7d548307efafe33230528756de3c5841a17 # v2
        with:
          use-installer: true

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: sam build
        run: sam build

      - name: sam deploy
        run: |
          sam deploy \
            --stack-name "$STACK_NAME" \
            --parameter-overrides Environment=$SAM_ENVIRONMENT \
            --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM \
            --resolve-s3 \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --region "$AWS_REGION"

      - name: Read stack outputs
        id: outputs
        run: |
          get_output () {
            aws cloudformation describe-stacks \
              --stack-name "$STACK_NAME" \
              --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue" \
              --output text
          }
          echo "patient_api_url=$(get_output PatientApiEndpoint)" >> "$GITHUB_OUTPUT"
          echo "cognito_domain=$(get_output CognitoHostedUiDomain)" >> "$GITHUB_OUTPUT"
          echo "cognito_client_id=$(get_output CognitoUserPoolClientId)" >> "$GITHUB_OUTPUT"
          echo "frontend_bucket=$(get_output FrontendBucketName)" >> "$GITHUB_OUTPUT"
          echo "frontend_distribution_id=$(get_output FrontendDistributionId)" >> "$GITHUB_OUTPUT"
          echo "frontend_url=$(get_output FrontendUrl)" >> "$GITHUB_OUTPUT"
          echo "custom_domain_url=$(get_output CustomDomainUrl)" >> "$GITHUB_OUTPUT"

  deploy-frontend:
    name: Deploy frontend (S3 + CloudFront)
    needs: deploy-backend
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Write .env from stack outputs
        env:
          LIVE_URL: ${{ needs.deploy-backend.outputs.custom_domain_url || needs.deploy-backend.outputs.frontend_url }}
        run: |
          cat > .env << EOF
          VITE_PATIENT_API_URL=${{ needs.deploy-backend.outputs.patient_api_url }}
          VITE_COGNITO_DOMAIN=${{ needs.deploy-backend.outputs.cognito_domain }}
          VITE_COGNITO_CLIENT_ID=${{ needs.deploy-backend.outputs.cognito_client_id }}
          VITE_REDIRECT_URI=${LIVE_URL}/
          EOF

      - name: Build
        run: npm run build

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: arn:aws:iam::460223322833:role/healthlab-github-deploy
          aws-region: us-east-1

      - name: Sync to S3
        run: |
          aws s3 sync dist/ "s3://${{ needs.deploy-backend.outputs.frontend_bucket }}" --delete

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ needs.deploy-backend.outputs.frontend_distribution_id }}" \
            --paths "/*"

      - name: Live URL
        run: |
          echo "Deployed to ${{ needs.deploy-backend.outputs.custom_domain_url || needs.deploy-backend.outputs.frontend_url }}"
          echo "(default CloudFront domain: ${{ needs.deploy-backend.outputs.frontend_url }})"
