AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: HealthLab Portal - Serverless patient onboarding and identity verification backend

Globals:
  Function:
    Runtime: python3.13
    Timeout: 20
    MemorySize: 128
    Tracing: Active
    Environment:
      Variables:
        BUCKET_NAME: !Ref IntakeBucket
        TABLE_NAME: !Ref PatientRecordsTable
        TOPIC_ARN: !Ref OnboardingNotifications
        QUEUE_URL: !Ref EligibilityQueue

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - staging
      - prod
    Description: Environment name

  DomainName:
    Type: String
    Default: healthlabportal.com
    Description: Custom domain for the frontend. Leave empty to serve from the default CloudFront domain only.

  HostedZoneId:
    Type: String
    Default: Z005943316NNIBXUORQW2
    Description: Route 53 hosted zone ID for DomainName. Required if DomainName is set.

Conditions:
  HasCustomDomain: !Not [!Equals [!Ref DomainName, '']]

Resources:
  # S3 bucket for patient intake documents
  IntakeBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'healthlab-intake-${AWS::AccountId}-${Environment}'
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      NotificationConfiguration:
        EventBridgeConfiguration:
          EventBridgeEnabled: true

  # DynamoDB table for patient records
  PatientRecordsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'PatientRecords-${Environment}'
      AttributeDefinitions:
        - AttributeName: INTAKE_ID
          AttributeType: S
      KeySchema:
        - AttributeName: INTAKE_ID
          KeyType: HASH
      BillingMode: PROVISIONED
      ProvisionedThroughput:
        ReadCapacityUnits: 2
        WriteCapacityUnits: 2
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  # SNS topic for onboarding notifications (care team / patient)
  OnboardingNotifications:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub 'OnboardingNotifications-${Environment}'
      DisplayName: HealthLab Onboarding Notifications
      KmsMasterKeyId: alias/aws/sns

  # SQS queue for insurance eligibility checks
  EligibilityQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub 'EligibilityQueue-${Environment}'
      VisibilityTimeout: 300
      MessageRetentionPeriod: 345600
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt EligibilityDeadLetterQueue.Arn
        maxReceiveCount: 5

  EligibilityDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub 'EligibilityDeadLetterQueue-${Environment}'
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true

  # ============================================================
  # Per-function least-privilege IAM roles.
  # Each Lambda gets only the permissions its own code actually calls,
  # instead of one broad role shared across all 7 functions (e.g.
  # ValidateEligibilityRole below is a pure request-body handler with no
  # AWS resource access at all - see src/validate_eligibility/app.py).
  # ============================================================

  UnzipRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'HealthLab-UnzipRole-${Environment}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/AWSXRayDaemonWriteAccess
      Policies:
        - PolicyName: S3ReadWritePolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                Resource: !Sub '${IntakeBucket.Arn}/*'

  WritePatientRecordRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'HealthLab-WritePatientRecordRole-${Environment}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/AWSXRayDaemonWriteAccess
      Policies:
        - PolicyName: S3ReadPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub '${IntakeBucket.Arn}/*'
        - PolicyName: DynamoDBWritePolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                Resource: !GetAtt PatientRecordsTable.Arn

  VerifyIdentityRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'HealthLab-VerifyIdentityRole-${Environment}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/AWSXRayDaemonWriteAccess
      Policies:
        - PolicyName: S3ReadPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub '${IntakeBucket.Arn}/*'
        - PolicyName: RekognitionAccessPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: rekognition:CompareFaces
                Resource: '*'
        - PolicyName: DynamoDBUpdatePolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: dynamodb:UpdateItem
                Resource: !GetAtt PatientRecordsTable.Arn
        - PolicyName: SNSPublishPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: sns:Publish
                Resource: !Ref OnboardingNotifications

  ExtractDetailsRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'HealthLab-ExtractDetailsRole-${Environment}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/AWSXRayDaemonWriteAccess
      Policies:
        - PolicyName: S3ReadPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub '${IntakeBucket.Arn}/*'
        - PolicyName: TextractAccessPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: textract:AnalyzeID
                Resource: '*'
        - PolicyName: DynamoDBReadWritePolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:UpdateItem
                Resource: !GetAtt PatientRecordsTable.Arn
        - PolicyName: SNSPublishPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: sns:Publish
                Resource: !Ref OnboardingNotifications

  SubmitEligibilityRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'HealthLab-SubmitEligibilityRole-${Environment}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/AWSXRayDaemonWriteAccess
      Policies:
        - PolicyName: SQSConsumePolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                Resource: !GetAtt EligibilityQueue.Arn
        - PolicyName: DynamoDBUpdatePolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: dynamodb:UpdateItem
                Resource: !GetAtt PatientRecordsTable.Arn
        - PolicyName: SNSPublishPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: sns:Publish
                Resource: !Ref OnboardingNotifications

  ValidateEligibilityRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'HealthLab-ValidateEligibilityRole-${Environment}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/AWSXRayDaemonWriteAccess
      # No resource-access policies: this handler is a pure function over its
      # request body - see src/validate_eligibility/app.py. It never touches
      # S3, DynamoDB, Rekognition, Textract, SNS, or SQS.

  PatientPortalRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'HealthLab-PatientPortalRole-${Environment}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/AWSXRayDaemonWriteAccess
      Policies:
        - PolicyName: S3PresignedUploadPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: s3:PutObject
                Resource: !Sub '${IntakeBucket.Arn}/*'
        - PolicyName: DynamoDBReadWritePolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                Resource: !GetAtt PatientRecordsTable.Arn

  # Lambda functions
  UnzipFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'HealthLab-Unzip-${Environment}'
      CodeUri: src/unzip/
      Handler: app.lambda_handler
      Role: !GetAtt UnzipRole.Arn

  WritePatientRecordFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'HealthLab-WritePatientRecord-${Environment}'
      CodeUri: src/write_patient_record/
      Handler: app.lambda_handler
      Role: !GetAtt WritePatientRecordRole.Arn

  VerifyIdentityFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'HealthLab-VerifyIdentity-${Environment}'
      CodeUri: src/verify_identity/
      Handler: app.lambda_handler
      Role: !GetAtt VerifyIdentityRole.Arn

  ExtractDetailsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'HealthLab-ExtractDetails-${Environment}'
      CodeUri: src/extract_details/
      Handler: app.lambda_handler
      Role: !GetAtt ExtractDetailsRole.Arn

  SubmitEligibilityFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'HealthLab-SubmitEligibility-${Environment}'
      CodeUri: src/submit_eligibility/
      Handler: app.lambda_handler
      Role: !GetAtt SubmitEligibilityRole.Arn
      Environment:
        Variables:
          API_ENDPOINT: !Sub 'https://${EligibilityApi}.execute-api.${AWS::Region}.amazonaws.com'
      Events:
        SQSEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt EligibilityQueue.Arn
            BatchSize: 1

  ValidateEligibilityFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'HealthLab-ValidateEligibility-${Environment}'
      CodeUri: src/validate_eligibility/
      Handler: app.lambda_handler
      Role: !GetAtt ValidateEligibilityRole.Arn
      Events:
        ApiEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref EligibilityApi
            Path: /eligibility
            Method: POST

  # API Gateway HTTP API for the mock eligibility service (internal)
  EligibilityApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      Name: !Sub 'EligibilityApi-${Environment}'
      CorsConfiguration:
        AllowOrigins:
          - '*'
        AllowMethods:
          - POST
        AllowHeaders:
          - Content-Type

  # ============================================================
  # Amazon Cognito - patient authentication (Hosted UI)
  # ============================================================

  PatientUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub 'HealthLabPatients-${Environment}'
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true

  PatientUserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Sub 'healthlab-patients-${AWS::AccountId}-${Environment}'
      UserPoolId: !Ref PatientUserPool

  PatientUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub 'HealthLabPatientPortal-${Environment}'
      UserPoolId: !Ref PatientUserPool
      GenerateSecret: false
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows:
        - code
      AllowedOAuthScopes:
        - openid
        - email
        - profile
      SupportedIdentityProviders:
        - COGNITO
      CallbackURLs:
        - http://localhost:5173/
        - !Sub 'https://${FrontendDistribution.DomainName}/'
        - !If [HasCustomDomain, !Sub 'https://${DomainName}/', !Ref 'AWS::NoValue']
      LogoutURLs:
        - http://localhost:5173/
        - !Sub 'https://${FrontendDistribution.DomainName}/'
        - !If [HasCustomDomain, !Sub 'https://${DomainName}/', !Ref 'AWS::NoValue']
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
        # Admin-only (requires IAM cognito-idp:AdminInitiateAuth, not exposed
        # to end users) - used for scripted/CI end-to-end testing.
        - ALLOW_ADMIN_USER_PASSWORD_AUTH

  # ============================================================
  # Patient-facing API - protected by Cognito JWT authorizer
  # ============================================================

  PatientApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      Name: !Sub 'PatientApi-${Environment}'
      CorsConfiguration:
        AllowOrigins:
          - 'http://localhost:5173'
          - !Sub 'https://${FrontendDistribution.DomainName}'
          - !If [HasCustomDomain, !Sub 'https://${DomainName}', !Ref 'AWS::NoValue']
        AllowMethods:
          - GET
          - POST
          - OPTIONS
        AllowHeaders:
          - Content-Type
          - Authorization
      Auth:
        DefaultAuthorizer: CognitoJwtAuthorizer
        Authorizers:
          CognitoJwtAuthorizer:
            IdentitySource: '$request.header.Authorization'
            JwtConfiguration:
              issuer: !Sub 'https://cognito-idp.${AWS::Region}.amazonaws.com/${PatientUserPool}'
              audience:
                - !Ref PatientUserPoolClient

  # Lambda backing the patient-facing API: issue a presigned upload URL and
  # look up onboarding status. Protected by the Cognito authorizer above.
  PatientPortalFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'HealthLab-PatientPortal-${Environment}'
      CodeUri: src/patient_portal/
      Handler: app.lambda_handler
      Role: !GetAtt PatientPortalRole.Arn
      Events:
        RequestUpload:
          Type: HttpApi
          Properties:
            ApiId: !Ref PatientApi
            Path: /intake/upload-url
            Method: POST
        GetStatus:
          Type: HttpApi
          Properties:
            ApiId: !Ref PatientApi
            Path: /intake/{intake_id}/status
            Method: GET
        GetFhir:
          Type: HttpApi
          Properties:
            ApiId: !Ref PatientApi
            Path: /intake/{intake_id}/fhir
            Method: GET

  # Step Functions state machine orchestrating the onboarding workflow
  OnboardingStateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      Name: !Sub 'OnboardingStateMachine-${Environment}'
      DefinitionUri: statemachine/onboarding_workflow.asl.json
      DefinitionSubstitutions:
        UnzipFunctionArn: !GetAtt UnzipFunction.Arn
        WritePatientRecordFunctionArn: !GetAtt WritePatientRecordFunction.Arn
        VerifyIdentityFunctionArn: !GetAtt VerifyIdentityFunction.Arn
        ExtractDetailsFunctionArn: !GetAtt ExtractDetailsFunction.Arn
        EligibilityQueueUrl: !Ref EligibilityQueue
      Tracing:
        Enabled: true
      Policies:
        - LambdaInvokePolicy:
            FunctionName: !Ref UnzipFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref WritePatientRecordFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref VerifyIdentityFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref ExtractDetailsFunction
        - SQSSendMessagePolicy:
            QueueName: !GetAtt EligibilityQueue.QueueName
        - Statement:
            - Effect: Allow
              Action:
                - xray:PutTraceSegments
                - xray:PutTelemetryRecords
              Resource: '*'

  # ============================================================
  # Frontend hosting - S3 (private, OAC-restricted) + CloudFront
  # No custom domain yet; served from the default *.cloudfront.net
  # ============================================================

  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'healthlab-frontend-${AWS::AccountId}-${Environment}'
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  FrontendOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub 'healthlab-frontend-oac-${Environment}'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # ACM certs for CloudFront must live in us-east-1 (this stack already
  # deploys there). DNS-validated via the Route 53 hosted zone directly -
  # CloudFormation creates the validation record and waits for it itself.
  FrontendCertificate:
    Type: AWS::CertificateManager::Certificate
    Condition: HasCustomDomain
    Properties:
      DomainName: !Ref DomainName
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref DomainName
          HostedZoneId: !Ref HostedZoneId

  # WAFv2 web ACL for the frontend. Must be created in us-east-1 for
  # CloudFront scope (this stack already deploys there). Managed here
  # rather than attached out-of-band, so it can't be silently dropped by a
  # future stack update that resends the distribution's full config.
  FrontendWebAcl:
    Type: AWS::WAFv2::WebACL
    Properties:
      Name: !Sub 'healthlab-frontend-waf-${Environment}'
      Scope: CLOUDFRONT
      DefaultAction:
        Allow: {}
      VisibilityConfig:
        SampledRequestsEnabled: true
        CloudWatchMetricsEnabled: true
        MetricName: !Sub 'healthlab-frontend-waf-${Environment}'
      Rules:
        - Name: AWS-AWSManagedRulesCommonRuleSet
          Priority: 0
          OverrideAction:
            None: {}
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesCommonRuleSet
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: CommonRuleSet
        - Name: AWS-AWSManagedRulesKnownBadInputsRuleSet
          Priority: 1
          OverrideAction:
            None: {}
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesKnownBadInputsRuleSet
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: KnownBadInputs
        - Name: RateLimitPerIP
          Priority: 2
          Action:
            Block: {}
          Statement:
            RateBasedStatement:
              Limit: 1000
              AggregateKeyType: IP
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: RateLimitPerIP

  FrontendDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        HttpVersion: http2
        WebACLId: !GetAtt FrontendWebAcl.Arn
        Aliases: !If [HasCustomDomain, [!Ref DomainName], !Ref 'AWS::NoValue']
        ViewerCertificate: !If
          - HasCustomDomain
          - AcmCertificateArn: !Ref FrontendCertificate
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          - CloudFrontDefaultCertificate: true
        Origins:
          - Id: FrontendOrigin
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            S3OriginConfig: {}
            OriginAccessControlId: !GetAtt FrontendOAC.Id
        DefaultCacheBehavior:
          TargetOriginId: FrontendOrigin
          ViewerProtocolPolicy: redirect-to-https
          # Managed-CachingOptimized
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${FrontendBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${FrontendDistribution}'

  FrontendDnsRecord:
    Type: AWS::Route53::RecordSet
    Condition: HasCustomDomain
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: A
      AliasTarget:
        # Fixed AWS-documented hosted zone ID for any CloudFront distribution
        # (not account- or distribution-specific).
        HostedZoneId: Z2FDTNDATAQYW2
        DNSName: !GetAtt FrontendDistribution.DomainName
        EvaluateTargetHealth: false

  # EventBridge rule to trigger the workflow on intake upload
  IntakeUploadRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub 'IntakeUploadRule-${Environment}'
      Description: Trigger onboarding state machine on S3 upload to intake/ prefix
      EventPattern:
        source:
          - aws.s3
        detail-type:
          - Object Created
        detail:
          bucket:
            name:
              - !Ref IntakeBucket
          object:
            key:
              - prefix: intake/
      State: ENABLED
      Targets:
        - Id: OnboardingStateMachineTarget
          Arn: !GetAtt OnboardingStateMachine.Arn
          RoleArn: !GetAtt EventBridgeRole.Arn

  EventBridgeRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: StartStateMachinePolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: states:StartExecution
                Resource: !GetAtt OnboardingStateMachine.Arn

  # ============================================================
  # Observability - CloudWatch dashboard + alarms
  # Separate from OnboardingNotifications (patient/care-team facing):
  # this topic is for infra/ops signals - subscribe an on-call email here.
  # ============================================================

  OperationalAlarms:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub 'OperationalAlarms-${Environment}'
      DisplayName: HealthLab Operational Alarms
      KmsMasterKeyId: alias/aws/sns

  StepFunctionsFailedExecutionsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'HealthLab-StepFunctionsFailed-${Environment}'
      AlarmDescription: An onboarding workflow execution failed
      Namespace: AWS/States
      MetricName: ExecutionsFailed
      Dimensions:
        - Name: StateMachineArn
          Value: !GetAtt OnboardingStateMachine.Arn
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref OperationalAlarms

  EligibilityDeadLetterQueueAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'HealthLab-EligibilityDLQNotEmpty-${Environment}'
      AlarmDescription: A message landed in the eligibility DLQ - a check exhausted its retries
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt EligibilityDeadLetterQueue.QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref OperationalAlarms

  PatientApi5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'HealthLab-PatientApi5xx-${Environment}'
      AlarmDescription: Patient API is returning server errors
      Namespace: AWS/ApiGateway
      MetricName: 5xx
      Dimensions:
        - Name: ApiId
          Value: !Ref PatientApi
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref OperationalAlarms

  WritePatientRecordErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'HealthLab-WritePatientRecordErrors-${Environment}'
      AlarmDescription: WritePatientRecord threw an unhandled error - nothing downstream can proceed
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref WritePatientRecordFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref OperationalAlarms

  PatientPortalErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'HealthLab-PatientPortalErrors-${Environment}'
      AlarmDescription: The patient-facing API Lambda threw an unhandled error
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref PatientPortalFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref OperationalAlarms

  OperationsDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub 'HealthLab-Operations-${Environment}'
      DashboardBody: !Sub |
        {
          "widgets": [
            {
              "type": "metric", "x": 0, "y": 0, "width": 12, "height": 6,
              "properties": {
                "title": "Onboarding workflow executions",
                "view": "timeSeries", "region": "${AWS::Region}",
                "metrics": [
                  ["AWS/States", "ExecutionsSucceeded", "StateMachineArn", "${OnboardingStateMachine.Arn}", {"label": "Succeeded"}],
                  ["AWS/States", "ExecutionsFailed", "StateMachineArn", "${OnboardingStateMachine.Arn}", {"label": "Failed"}]
                ],
                "stat": "Sum", "period": 300
              }
            },
            {
              "type": "metric", "x": 12, "y": 0, "width": 12, "height": 6,
              "properties": {
                "title": "Patient API traffic",
                "view": "timeSeries", "region": "${AWS::Region}",
                "metrics": [
                  ["AWS/ApiGateway", "Count", "ApiId", "${PatientApi}", {"label": "Requests"}],
                  ["AWS/ApiGateway", "4xx", "ApiId", "${PatientApi}", {"label": "4xx"}],
                  ["AWS/ApiGateway", "5xx", "ApiId", "${PatientApi}", {"label": "5xx"}]
                ],
                "stat": "Sum", "period": 300
              }
            },
            {
              "type": "metric", "x": 0, "y": 6, "width": 12, "height": 6,
              "properties": {
                "title": "Lambda errors by function",
                "view": "timeSeries", "region": "${AWS::Region}",
                "metrics": [
                  ["AWS/Lambda", "Errors", "FunctionName", "${UnzipFunction}", {"label": "Unzip"}],
                  ["AWS/Lambda", "Errors", "FunctionName", "${WritePatientRecordFunction}", {"label": "WritePatientRecord"}],
                  ["AWS/Lambda", "Errors", "FunctionName", "${VerifyIdentityFunction}", {"label": "VerifyIdentity"}],
                  ["AWS/Lambda", "Errors", "FunctionName", "${ExtractDetailsFunction}", {"label": "ExtractDetails"}],
                  ["AWS/Lambda", "Errors", "FunctionName", "${SubmitEligibilityFunction}", {"label": "SubmitEligibility"}],
                  ["AWS/Lambda", "Errors", "FunctionName", "${ValidateEligibilityFunction}", {"label": "ValidateEligibility"}],
                  ["AWS/Lambda", "Errors", "FunctionName", "${PatientPortalFunction}", {"label": "PatientPortal"}]
                ],
                "stat": "Sum", "period": 300
              }
            },
            {
              "type": "metric", "x": 12, "y": 6, "width": 12, "height": 6,
              "properties": {
                "title": "Eligibility queue depth",
                "view": "timeSeries", "region": "${AWS::Region}",
                "metrics": [
                  ["AWS/SQS", "ApproximateNumberOfMessagesVisible", "QueueName", "${EligibilityQueue.QueueName}", {"label": "Main queue"}],
                  ["AWS/SQS", "ApproximateNumberOfMessagesVisible", "QueueName", "${EligibilityDeadLetterQueue.QueueName}", {"label": "DLQ"}]
                ],
                "stat": "Maximum", "period": 300
              }
            }
          ]
        }

Outputs:
  IntakeBucketName:
    Description: S3 bucket for patient intake documents
    Value: !Ref IntakeBucket
    Export:
      Name: !Sub '${AWS::StackName}-IntakeBucket'

  PatientRecordsTableName:
    Description: DynamoDB table for patient records
    Value: !Ref PatientRecordsTable
    Export:
      Name: !Sub '${AWS::StackName}-PatientRecordsTable'

  OnboardingNotificationsTopicArn:
    Description: SNS topic ARN for onboarding notifications
    Value: !Ref OnboardingNotifications
    Export:
      Name: !Sub '${AWS::StackName}-OnboardingNotifications'

  EligibilityQueueUrl:
    Description: SQS queue URL for eligibility checks
    Value: !Ref EligibilityQueue
    Export:
      Name: !Sub '${AWS::StackName}-EligibilityQueue'

  EligibilityApiEndpoint:
    Description: API Gateway endpoint for the eligibility service
    Value: !Sub 'https://${EligibilityApi}.execute-api.${AWS::Region}.amazonaws.com'
    Export:
      Name: !Sub '${AWS::StackName}-ApiEndpoint'

  StateMachineArn:
    Description: Step Functions state machine ARN
    Value: !GetAtt OnboardingStateMachine.Arn
    Export:
      Name: !Sub '${AWS::StackName}-StateMachine'

  PatientApiEndpoint:
    Description: Patient-facing API endpoint (Cognito-protected)
    Value: !Sub 'https://${PatientApi}.execute-api.${AWS::Region}.amazonaws.com'
    Export:
      Name: !Sub '${AWS::StackName}-PatientApi'

  CognitoUserPoolId:
    Description: Cognito User Pool ID
    Value: !Ref PatientUserPool
    Export:
      Name: !Sub '${AWS::StackName}-UserPoolId'

  CognitoUserPoolClientId:
    Description: Cognito User Pool app client ID
    Value: !Ref PatientUserPoolClient
    Export:
      Name: !Sub '${AWS::StackName}-UserPoolClientId'

  CognitoHostedUiDomain:
    Description: Cognito Hosted UI domain
    Value: !Sub 'https://healthlab-patients-${AWS::AccountId}-${Environment}.auth.${AWS::Region}.amazoncognito.com'
    Export:
      Name: !Sub '${AWS::StackName}-CognitoDomain'

  FrontendBucketName:
    Description: S3 bucket the frontend build is synced to
    Value: !Ref FrontendBucket
    Export:
      Name: !Sub '${AWS::StackName}-FrontendBucket'

  FrontendDistributionId:
    Description: CloudFront distribution ID for the frontend (used for cache invalidation)
    Value: !Ref FrontendDistribution
    Export:
      Name: !Sub '${AWS::StackName}-FrontendDistributionId'

  FrontendUrl:
    Description: Live URL for the patient portal frontend
    Value: !Sub 'https://${FrontendDistribution.DomainName}'
    Export:
      Name: !Sub '${AWS::StackName}-FrontendUrl'

  CustomDomainUrl:
    Condition: HasCustomDomain
    Description: Custom domain URL for the frontend
    Value: !Sub 'https://${DomainName}'
    Export:
      Name: !Sub '${AWS::StackName}-CustomDomainUrl'

  OperationalAlarmsTopicArn:
    Description: SNS topic for infra/ops CloudWatch alarms - subscribe an on-call email to this
    Value: !Ref OperationalAlarms
    Export:
      Name: !Sub '${AWS::StackName}-OperationalAlarms'

  DashboardUrl:
    Description: CloudWatch operations dashboard
    Value: !Sub 'https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#dashboards:name=HealthLab-Operations-${Environment}'
